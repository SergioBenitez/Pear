[package]
name = "pear_codegen"
version = "0.2.9"
authors = ["Sergio Benitez <sb@sergio.bz>"]
description = "A (codegen) pear is a fruit."
license = "MIT OR Apache-2.0"
edition = "2018"
rust-version = "1.71"
repository = "https://github.com/SergioBenitez/Pear"

[lib]
proc-macro = true

[dependencies]
quote = "1.0.47"
proc-macro2 = "1.0.107"
syn = { version = "3.0.6", features = ["full", "extra-traits", "visit-mut"] }
proc-macro2-diagnostics = "0.11.0"

[dev-dependencies]
pear = { path = "../lib" }
